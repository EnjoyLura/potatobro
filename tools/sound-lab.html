<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Lab · 核芯突围</title>
<style>
  :root {
    --bg: #17131c; --panel: #221c2a; --panel2: #2b2434; --line: #3a3145; --text: #ece6f2; --dim: #a49bb0;
    --gold: #ffd166; --good: #5fe0a0; --bad: #ff6b6b; --warn: #ffb347; --accent: #8ec5ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: #5a4d6a; }
  button.primary { background: #4f8a5b; border-color: #5fa06c; font-weight: 600; }
  button.gold { background: #6b5320; border-color: #a8832e; color: var(--gold); font-weight: 600; }
  button.icon { padding: 4px 9px; min-width: 34px; }
  button:disabled { opacity: .45; cursor: default; }
  input[type=range] { width: 100%; accent-color: var(--gold); }
  select, input[type=text], textarea { background: #1b1621; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  textarea { width: 100%; resize: vertical; min-height: 30px; }

  header { position: sticky; top: 0; z-index: 10; background: rgba(23,19,28,.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1500px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .title { font-weight: 800; font-size: 17px; margin-right: 6px; }
  .title small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .grow { flex: 1; }
  .chips { display: flex; gap: 4px; }
  .chip { border-radius: 999px; padding: 4px 11px; font-size: 13px; }
  .chip.on { background: #4a3d5a; border-color: #7b6a90; }
  .stat { font-size: 13px; color: var(--dim); }
  .stat b.g { color: var(--good); } .stat b.r { color: var(--bad); } .stat b.u { color: var(--warn); }
  .dirty { color: var(--warn); font-size: 13px; }
  #toast { position: fixed; right: 18px; bottom: 18px; background: #2f3b2f; border: 1px solid #5fa06c; padding: 10px 14px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 420px; }
  #toast.err { background: #3b2a2a; border-color: var(--bad); }
  #toast.show { opacity: 1; }

  main { max-width: 1500px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 360px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  aside { position: sticky; top: 70px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 86px); overflow: auto; padding-right: 2px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .card h3 .hint { font-weight: 400; color: var(--dim); font-size: 12px; }
  .row { display: grid; grid-template-columns: 74px 1fr 46px; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; }
  .row .v { text-align: right; color: var(--gold); font-variant-numeric: tabular-nums; }
  .busrow { border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 6px; }
  .busname { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; }
  .meter { height: 6px; background: #1b1621; border-radius: 3px; overflow: hidden; margin: 4px 0 2px; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--good), var(--warn), var(--bad)); width: 0; transition: width .08s; }
  .busstat { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .sim-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0; }
  .sim-slots select { width: 100%; padding: 3px 4px; font-size: 12px; }
  .check { display: flex; gap: 6px; align-items: center; font-size: 13px; margin: 3px 0; }
  .muted { color: var(--dim); font-size: 12px; }

  section.group { margin-bottom: 18px; }
  section.group > h2 { font-size: 15px; margin: 4px 0 10px; display: flex; gap: 8px; align-items: center; }
  section.group > h2 .tag { font-size: 12px; color: var(--dim); font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 12px; }
  .snd { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .snd.fail { border-color: #8a3a3a; box-shadow: inset 3px 0 0 var(--bad); }
  .snd.pass { box-shadow: inset 3px 0 0 var(--good); }
  .snd.mute { opacity: .6; }
  .snd-head { display: flex; align-items: center; gap: 8px; }
  .snd-head .name { font-weight: 700; }
  .snd-head .key { color: var(--dim); font-size: 12px; font-family: Consolas, monospace; }
  .snd-head .sp { flex: 1; }
  .play { background: #3d5f8a; border-color: #5c84b8; font-weight: 700; }
  .vars { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
  .var { background: var(--panel2); border-radius: 8px; padding: 6px 8px; }
  .var-top { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .var-top .fn { font-family: Consolas, monospace; font-size: 12px; }
  .var-top .info { color: var(--dim); font-size: 11px; flex: 1; }
  .rv { padding: 2px 8px; font-size: 12px; border-radius: 6px; }
  .rv.pass.on { background: #2e5a40; border-color: var(--good); color: var(--good); }
  .rv.fail.on { background: #5a2e2e; border-color: var(--bad); color: var(--bad); }
  canvas.wave { width: 100%; height: 34px; display: block; margin-top: 4px; border-radius: 4px; background: #17131c; cursor: pointer; }
  .note { margin-top: 4px; }
  .params { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; }
  .params .row { grid-template-columns: 58px 1fr 40px; margin: 2px 0; }
  .snd-foot { display: flex; gap: 10px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--dim); }
  .snd-foot select { padding: 2px 4px; font-size: 12px; }
  .empty { color: var(--dim); padding: 30px; text-align: center; }
  .bgm-pos { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--dim); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 4px 10px; }
  .seg button.on { background: #4a3d5a; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="title">音效工作台<small>核芯突围：万械狂潮</small></div>
    <div class="chips" id="filters"></div>
    <input type="text" id="search" placeholder="搜索名称 / 文件" style="width:170px">
    <span class="stat" id="stats"></span>
    <span class="grow"></span>
    <span class="dirty" id="dirty"></span>
    <button id="btnFailList" title="复制所有不及格的文件和备注，发给 Claude 重新生成">复制不及格清单</button>
    <button id="btnDownload">下载 JSON</button>
    <button id="btnRevert">撤销未保存</button>
    <button class="primary" id="btnSave">保存配置</button>
  </div>
</header>
<main>
  <aside>
    <div class="card" id="bgmCard">
      <h3>背景音乐 <span class="hint" id="bgmFile"></span></h3>
      <div style="display:flex; gap:8px; align-items:center; margin-bottom:6px">
        <button class="icon play" id="bgmPlay">▶</button>
        <span class="seg" id="bgmMood"><button data-m="1" class="on">战斗</button><button data-m="2">首领</button><button data-m="0">菜单/商店</button></span>
      </div>
      <div class="bgm-pos"><span id="bgmT">0:00</span><input type="range" id="bgmSeek" min="0" max="1000" value="0"><span id="bgmD">0:00</span></div>
      <div id="bgmParams"></div>
    </div>
    <div class="card">
      <h3>总线混音 <span class="hint">同时播放太多时自动压低</span></h3>
      <div id="masterParams"></div>
      <div id="busList"></div>
    </div>
    <div class="card">
      <h3>战斗模拟 <span class="hint">按游戏规则模拟满装备开火</span></h3>
      <div class="sim-slots" id="simSlots"></div>
      <div id="simParams"></div>
      <label class="check"><input type="checkbox" id="simEvents" checked> 随机受伤 / 升级 / 精英</label>
      <label class="check"><input type="checkbox" id="simMusic" checked> 同时播放背景音乐</label>
      <div style="display:flex; gap:8px; margin-top:6px; align-items:center">
        <button class="gold" id="simBtn">▶ 开始模拟</button>
        <span class="muted" id="simInfo"></span>
      </div>
    </div>
    <div class="card muted">
      <b style="color:var(--text)">用法</b><br>
      只有枪械、近战、击杀和点击用录音素材，其余都是合成音色（♪）。<br>
      ▶ 按游戏里的处理播放（去头部静音、响度统一、随机音高、截断）。点波形可试听原声。「响度」用来对比不同音效的大小。<br>
      每个音效标记 ✓ 通过 / ✗ 不及格并写备注，「复制不及格清单」发给 Claude 替换。<br>
      「保存配置」写入 <code>build-templates/web-mobile/sfx/config.json</code>，如果已有构建也会同步到 <code>build/</code>。下次构建游戏生效。
    </div>
  </aside>
  <div id="list"></div>
</main>
<div id="toast"></div>
<script src="sound-lab.js"></script>
</body>
</html>

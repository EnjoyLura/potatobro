  <!-- Sharp canvas on phones (both hooks are wired into the engine by tools/postbuild.py):
       __CR_DPR_CAP: replaces the engine's devicePixelRatio cap of 2. Real ratio up to 4, so 3x/3.5x/4x
       phones render at native resolution; desktop page zoom-out is compensated so the buffer does not
       explode; ?dpr=2 (or 1) in the URL saves battery.
       __CR_LABEL_SCALE: extra resolution for label text. The engine draws text at fontSize x view scale
       and ignores node scale, so text under the scaled UI root (__CR_TEXT_SCALE, set by the game) or a
       scaled node was stretched and soft. -->
  <script>
    (function () {
      var q = 0;
      try { q = parseFloat(new URLSearchParams(location.search).get('dpr')) || 0; } catch (e) { }
      window.__CR_DPR_CAP = function () {
        var real = window.devicePixelRatio || 1;
        var zoom = (window.visualViewport && window.visualViewport.scale) || 1;
        var cap = q > 0 ? Math.min(real, q) : Math.min(real, 4) * Math.min(1, zoom);
        return Math.max(0.5, cap);
      };
      window.__CR_LABEL_SCALE = function (label) {
        var k = window.__CR_TEXT_SCALE || 1;
        try {
          // a label first drawn mid pop-in (scale near 0) still gets the UI scale
          var s = label.node.worldScale;
          k = Math.max(k, Math.abs(s.x), Math.abs(s.y));
        } catch (e) { }
        return Math.min(3, k);
      };
    })();
  </script>
